<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 0.95em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #5568d3;
        }

        .input-group button:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }

        .todo-item.completed {
            opacity: 0.6;
            background: #f0f0f0;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            color: #333;
            font-size: 1em;
            word-break: break-word;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .priority-badge.high {
            background: #fecaca;
            color: #991b1b;
        }

        .priority-badge.medium {
            background: #fde047;
            color: #92400e;
        }

        .priority-badge.low {
            background: #bbf7d0;
            color: #065f46;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #f87171;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        .clear-all-btn {
            width: 100%;
            padding: 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .clear-all-btn:hover {
            background: #dc2626;
        }

        .priority-select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .input-group {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            border-left: 4px solid #22c55e;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✓ Todo List</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="success-message" id="successMessage"></div>

        <div class="input-group">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                autocomplete="off"
            />
            <select id="prioritySelect" class="priority-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button onclick="addTodo()">Add</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="remainingCount">0</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterTodos('all')">All</button>
            <button class="filter-btn" onclick="filterTodos('active')">Active</button>
            <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
            <button class="filter-btn" onclick="filterTodos('high')">High Priority</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📝</div>
            <p>No tasks here. Add one to get started!</p>
        </div>

        <button class="clear-all-btn" onclick="clearCompleted()">Clear Completed Tasks</button>
    </div>

    <script>
        // Local Storage Manager
        const StorageManager = {
            STORAGE_KEY: 'todoList',

            getTodos() {
                const todos = localStorage.getItem(this.STORAGE_KEY);
                return todos ? JSON.parse(todos) : [];
            },

            saveTodos(todos) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(todos));
            },

            addTodo(todo) {
                const todos = this.getTodos();
                todo.id = Date.now();
                todo.createdAt = new Date().toISOString();
                todos.unshift(todo);
                this.saveTodos(todos);
                return todo;
            },

            deleteTodo(id) {
                let todos = this.getTodos();
                todos = todos.filter(todo => todo.id !== id);
                this.saveTodos(todos);
            },

            updateTodo(id, updates) {
                let todos = this.getTodos();
                todos = todos.map(todo =>
                    todo.id === id ? { ...todo, ...updates } : todo
                );
                this.saveTodos(todos);
            },

            toggleComplete(id) {
                let todos = this.getTodos();
                todos = todos.map(todo =>
                    todo.id === id ? { ...todo, completed: !todo.completed } : todo
                );
                this.saveTodos(todos);
            },

            clearCompleted() {
                let todos = this.getTodos();
                todos = todos.filter(todo => !todo.completed);
                this.saveTodos(todos);
            }
        };

        // UI Manager
        let currentFilter = 'all';

        function addTodo() {
            const input = document.getElementById('todoInput');
            const priority = document.getElementById('prioritySelect').value;
            const text = input.value.trim();

            if (text === '') {
                showMessage('Please enter a task!', false);
                return;
            }

            if (text.length > 100) {
                showMessage('Task is too long (max 100 characters)', false);
                return;
            }

            StorageManager.addTodo({
                text,
                priority,
                completed: false
            });

            input.value = '';
            input.focus();
            document.getElementById('prioritySelect').value = 'medium';
            showMessage('Task added successfully!', true);
            render();
        }

        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                StorageManager.deleteTodo(id);
                showMessage('Task deleted!', true);
                render();
            }
        }

        function toggleTodo(id) {
            StorageManager.toggleComplete(id);
            render();
        }

        function filterTodos(filter) {
            currentFilter = filter;

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            render();
        }

        function clearCompleted() {
            const todos = StorageManager.getTodos();
            const completedCount = todos.filter(t => t.completed).length;

            if (completedCount === 0) {
                showMessage('No completed tasks to clear!', false);
                return;
            }

            if (confirm(`Clear ${completedCount} completed task(s)?`)) {
                StorageManager.clearCompleted();
                showMessage('Completed tasks cleared!', true);
                render();
            }
        }

        function showMessage(message, success) {
            const messageEl = document.getElementById('successMessage');
            messageEl.textContent = message;
            messageEl.style.background = success ? '#dcfce7' : '#fee2e2';
            messageEl.style.color = success ? '#166534' : '#991b1b';
            messageEl.style.borderLeftColor = success ? '#22c55e' : '#ef4444';
            messageEl.classList.add('show');

            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }

        function getFilteredTodos(todos) {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(t => !t.completed);
                case 'completed':
                    return todos.filter(t => t.completed);
                case 'high':
                    return todos.filter(t => t.priority === 'high');
                default:
                    return todos;
            }
        }

        function updateStats() {
            const todos = StorageManager.getTodos();
            const completed = todos.filter(t => t.completed).length;
            const remaining = todos.length - completed;

            document.getElementById('totalCount').textContent = todos.length;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('remainingCount').textContent = remaining;
        }

        function render() {
            const todos = StorageManager.getTodos();
            const filteredTodos = getFilteredTodos(todos);
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');

            // Update stats
            updateStats();

            // Clear list
            todoList.innerHTML = '';

            // Show empty state if no todos
            if (filteredTodos.length === 0) {
                emptyState.style.display = 'block';
                todoList.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            todoList.style.display = 'block';

            // Render todos
            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

                li.innerHTML = `
                    <input
                        type="checkbox"
                        class="checkbox"
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                    />
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <span class="priority-badge ${todo.priority}">${todo.priority}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                `;

                todoList.appendChild(li);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Keyboard shortcut
        document.getElementById('todoInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // Initial render
        render();
    </script>
</body>
</html>
